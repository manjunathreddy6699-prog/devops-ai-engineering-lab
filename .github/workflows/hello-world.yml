# This is a basic workflow to help you get started with Actions

name: hello-world

on:
  schedule:
    - cron: '00 6 1 * *'
  
  push:
    paths: 
      - '.github/workflows/**'
    branches: [ "main" ]
    

  pull_request:
    paths:
      - '.github/workflows/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: build job
        run: echo this is build job

  test:
    needs: build
    runs-on:  ubuntu-22.04
    steps:
      - name: test job 
        run: echo this is a test job
  deploy:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: deploy job
        run: echo this is deployment job
  
  
      
