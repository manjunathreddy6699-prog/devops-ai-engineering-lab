# This is a basic workflow to help you get started with Actions

name: hello-world

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches:
      - main


jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Print welcome message
        run: echo Hello World !

      - name: Runner Information
        run: hostname && date -u
      
